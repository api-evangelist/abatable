docs_note: >-
  Abatable publishes no scopes or permissions reference. The scopes below are the
  `scopes_supported` array its Auth0 OIDC discovery document advertises — the standard OIDC claim
  scopes plus Auth0's profile-claim scopes. They are identity scopes, not API authorisation
  scopes: no Abatable-specific resource scope (read:*, write:*) is published anywhere, and the
  Cloudflare Access authorization server that guards the MCP endpoint publishes no
  `scopes_supported` at all.
schemes:
- name: Auth0 OIDC
  source: well-known/abatable-login-openid-configuration.json
  issuer: https://login.abatable.com/
  flows:
