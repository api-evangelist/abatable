aid: abatable
name: Abatable
description: >-
  Abatable (legal entity Zero Imprint Ltd, London) operates a procurement and intelligence platform
  for environmental assets — principally voluntary carbon credits and CORSIA-eligible units. Buyers
  run structured RFPs against a network of 5,000+ project developers, commission tiered third-party
  due diligence, and monitor delivered portfolios from one dashboard; investors and developers buy
  the same market intelligence layer, built from 85,000+ transaction price points, vintage forward
  curves, country policy profiles and supply/demand tracking across 18,000+ projects in 23
  registries. The company holds no inventory and represents no seller, and is funded by buyers
  rather than suppliers. The product is delivered as an authenticated SaaS application at
  app.abatable.com; there is no public developer program, no published API reference and no
  machine-readable contract, though the company does operate an undocumented, OAuth-gated Model
  Context Protocol server at mcp.abatable.com.
