apis:
- aid: abatable:abatable-mcp-server
  name: Abatable MCP Server
  description: >-
    A hosted Model Context Protocol endpoint operated by Abatable at mcp.abatable.com, fronted by
    Cloudflare Access. It advertises itself as an OAuth protected resource under RFC 9728 and
    publishes RFC 8414 authorization-server metadata pointing at Abatable's own Cloudflare Zero
    Trust team domain. The tool set could not be enumerated anonymously — tools/list returns an
    OAuth challenge — and Abatable does not document the server anywhere on its public site, so
    this entry records a probed agent surface, not a published product.
  image: https://cdn.prod.website-files.com/6a21901ab9e1e5d902f470f8/6a21901ab9e1e5d902f471a6_abatable-open-graph.jpg
